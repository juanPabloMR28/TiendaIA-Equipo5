services:
  - type: web
    name: tiendaia-ia-equipo5
    runtime: python
    plan: free
    rootDir: ia_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: VENTAS_URL
        sync: false
      - key: /tmp/modelos/modelo.joblib
        value: /tmp/modelo.joblib
      - key: PYTHON_VERSION
        value: 3.12.7

  - type: web
    name: tiendaia-web-equipo5
    runtime: static
    rootDir: fronted
    buildCommand: echo "sin construccion"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff